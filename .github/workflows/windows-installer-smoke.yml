name: Windows installer smoke test

on:
  push:
    branches:
      - codex/win-installer-fix

permissions:
  contents: read

jobs:
  installer-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CANDIDATE_URL: https://legalwork-1318565101.cos.ap-guangzhou.myqcloud.com/legalwork/test/win-installer-034.exe
      OLD_INSTALLER_URL: https://github.com/sunyifeisb-art/legalwork/releases/download/v0.3.28/legalwork-0.3.28-win-x64.exe
    steps:
      - name: Download installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri $env:CANDIDATE_URL -OutFile "$env:RUNNER_TEMP\candidate.exe"
          Invoke-WebRequest -Uri $env:OLD_INSTALLER_URL -OutFile "$env:RUNNER_TEMP\old.exe"

      - name: Exercise fresh install, uninstall, and running-app upgrade
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-BoundedInstaller {
            param(
              [Parameter(Mandatory = $true)][string]$FilePath,
              [Parameter(Mandatory = $true)][string[]]$Arguments,
              [Parameter(Mandatory = $true)][string]$Label,
              [int]$TimeoutSeconds = 480
            )
            $startedAt = Get-Date
            Write-Host "[$Label] started at $($startedAt.ToString('o'))"
            $process = Start-Process -FilePath $FilePath -ArgumentList $Arguments -PassThru
            if (-not $process.WaitForExit($TimeoutSeconds * 1000)) {
              & taskkill.exe /F /T /PID $process.Id | Out-Host
              throw "[$Label] exceeded the ${TimeoutSeconds}s hard timeout: $FilePath"
            }
            if ($process.ExitCode -ne 0) {
              throw "[$Label] exited with code $($process.ExitCode): $FilePath"
            }
            Write-Host "[$Label] launcher exited after $([math]::Round(((Get-Date) - $startedAt).TotalSeconds, 1))s"
          }

          function Wait-PathAbsent {
            param(
              [Parameter(Mandatory = $true)][string]$Path,
              [Parameter(Mandatory = $true)][string]$Label,
              [int]$TimeoutSeconds = 480
            )
            $deadline = (Get-Date).AddSeconds($TimeoutSeconds)
            while (Test-Path $Path) {
              if ((Get-Date) -ge $deadline) {
                throw "[$Label] path still exists after ${TimeoutSeconds}s: $Path"
              }
              Start-Sleep -Seconds 2
            }
            Write-Host "[$Label] completed"
          }

          $freshDir = "$env:RUNNER_TEMP\legalwork-fresh"
          Invoke-BoundedInstaller -FilePath "$env:RUNNER_TEMP\candidate.exe" -Arguments @('/S', "/D=$freshDir") -Label 'fresh install' -TimeoutSeconds 60
          if (-not (Test-Path "$freshDir\legalwork.exe")) { throw 'Fresh install did not create legalwork.exe' }
          if (-not (Test-Path "$freshDir\Uninstall legalwork.exe")) { throw 'Fresh install did not create the uninstaller' }
          $python = "$freshDir\resources\office-runtime\python\python.exe"
          if (-not (Test-Path $python)) { throw 'Fresh install is missing bundled Python' }
          $runtimeManifest = Get-Content "$freshDir\resources\office-runtime\runtime.json" -Raw | ConvertFrom-Json
          if ($runtimeManifest.dataComplianceReady -ne $false) { throw 'Data-compliance runtime leaked into installer' }
          if (Test-Path "$freshDir\resources\office-runtime\python\Lib\site-packages\paddle") {
            throw 'Paddle was duplicated into installer instead of remaining on COS'
          }
          $env:PYTHONHOME = "$freshDir\resources\office-runtime\python"
          Invoke-BoundedInstaller -FilePath $python -Arguments @(
            '-c',
            'import docx, openpyxl, pptx, lxml, PIL, reportlab'
          ) -Label 'bundled Python imports' -TimeoutSeconds 180
          Remove-Item Env:PYTHONHOME
          $codex = "$freshDir\resources\codex-runtime\bin\codex.exe"
          if (-not (Test-Path $codex)) { throw 'Fresh install is missing Windows Codex runtime' }
          Invoke-BoundedInstaller -FilePath $codex -Arguments @('--version') -Label 'Windows Codex runtime' -TimeoutSeconds 30

          Invoke-BoundedInstaller -FilePath "$freshDir\Uninstall legalwork.exe" -Arguments @('/S', '/currentuser') -Label 'silent uninstall launcher'
          Wait-PathAbsent -Path "$freshDir\legalwork.exe" -Label 'silent uninstall'

          $upgradeDir = "$env:RUNNER_TEMP\legalwork-upgrade"
          Invoke-BoundedInstaller -FilePath "$env:RUNNER_TEMP\old.exe" -Arguments @('/S', "/D=$upgradeDir") -Label 'v0.3.28 install'
          if (-not (Test-Path "$upgradeDir\legalwork.exe")) { throw 'v0.3.28 setup failed' }

          Start-Process -FilePath "$upgradeDir\legalwork.exe" | Out-Null
          Start-Sleep -Seconds 12
          Invoke-BoundedInstaller -FilePath "$env:RUNNER_TEMP\candidate.exe" -Arguments @('/S', "/D=$upgradeDir") -Label 'running-app upgrade' -TimeoutSeconds 60
          if (-not (Test-Path "$upgradeDir\legalwork.exe")) { throw 'Upgrade removed legalwork.exe' }
          if (Get-Process -Name legalwork -ErrorAction SilentlyContinue) {
            throw 'Upgrade left a legalwork process running'
          }

          Write-Host 'Fresh install, uninstall, and running-app upgrade all completed within their hard timeouts.'
