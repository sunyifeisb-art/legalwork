name: Build Win-only (slim) and upload portable ZIP

# 用于只重新构建 Windows 安装包并补充 GitHub Release 资产的通道(不动 mac/linux)。
# 只允许从不可变 tag 重建，避免同一版本号指向不同源码和二进制。
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to use, e.g. v0.3.30'
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: 22
  WORKING_DIRECTORY: apps/desktop-legalwork

jobs:
  build-win:
    name: Build Windows x64 + upload portable ZIP
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name }}
          fetch-depth: 0

      - name: Verify immutable release source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag_name }}"
          VERSION="${TAG#v}"
          PACKAGE_VERSION=$(node -p "require('./apps/desktop-legalwork/package.json').version")
          test "$PACKAGE_VERSION" = "$VERSION"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$TAG")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci

      - name: Build Windows x64 (NSIS installer + portable ZIP)
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          LEGALWORK_APP_VERSION: ${{ steps.source.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGALWORK_ERROR_REPORT_GITHUB_REPO: ${{ secrets.ERROR_REPORT_REPO }}
          LEGALWORK_ERROR_REPORT_GITHUB_TOKEN: ${{ secrets.ERROR_REPORT_TOKEN }}
          LEGALWORK_ERROR_REPORT_GITHUB_LABEL: ${{ secrets.ERROR_REPORT_LABEL }}
        run: |
          npm run dist:win
          npx --yes electron-builder@26.8.1 --config electron-builder.config.cjs --publish never --win zip --x64

      - name: Upload portable ZIP to GitHub Release
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag_name }}"
          ZIP=$(ls dist/legalwork-*-win-x64.zip | head -1)
          gh release upload "$TAG" "$ZIP" --clobber --repo "${{ github.repository }}"
