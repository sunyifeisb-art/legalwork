name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag, for example v0.2.3'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  WORKING_DIRECTORY: apps/desktop-legalwork

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      version: ${{ steps.meta.outputs.version }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release metadata
        id: meta
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          TAG_NAME="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_name=LegalWork ${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.tag_name }}" \
            --title "${{ steps.meta.outputs.release_name }}" \
            --notes "Automated release from ${{ github.sha }}" \
            --draft \
            --target "${{ github.sha }}" \
            || true

  build-macos:
    name: Build macOS
    needs: create-release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci

      - name: Setup macOS signing credentials
        env:
          MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          MAC_API_KEY_BASE64: ${{ secrets.MAC_API_KEY_BASE64 }}
          MAC_API_KEY_ID: ${{ secrets.MAC_API_KEY_ID }}
        run: |
          if [ -z "$MAC_CERTIFICATE_BASE64" ]; then
            echo "No macOS signing certificate configured, skipping signing setup."
            exit 0
          fi
          mkdir -p /tmp/legalwork-certs
          echo "$MAC_CERTIFICATE_BASE64" | base64 -d > /tmp/legalwork-certs/mac.p12
          echo "$MAC_API_KEY_BASE64" | base64 -d > "/tmp/legalwork-certs/AuthKey_${MAC_API_KEY_ID}.p8"
          echo "MAC_CERT_PATH=/tmp/legalwork-certs/mac.p12" >> "$GITHUB_ENV"
          echo "MAC_API_KEY_PATH=/tmp/legalwork-certs/AuthKey_${MAC_API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Build macOS artifacts
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          LEGALWORK_APP_VERSION: ${{ needs.create-release.outputs.version }}
          LEGALWORK_UPDATE_CHANNEL: stable
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ env.MAC_CERT_PATH || '' }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ env.MAC_API_KEY_PATH || '' }}
          APPLE_API_KEY_ID: ${{ secrets.MAC_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.MAC_API_ISSUER }}
          LEGALWORK_ERROR_REPORT_GITHUB_REPO: ${{ secrets.ERROR_REPORT_REPO }}
          LEGALWORK_ERROR_REPORT_GITHUB_TOKEN: ${{ secrets.ERROR_REPORT_TOKEN }}
          LEGALWORK_ERROR_REPORT_GITHUB_LABEL: ${{ secrets.ERROR_REPORT_LABEL }}
        run: npm run dist:mac

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: |
            ${{ env.WORKING_DIRECTORY }}/dist/legalwork-*-mac-*
            ${{ env.WORKING_DIRECTORY }}/dist/latest-mac.yml
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Enable long paths for Git checkout
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci

      - name: Setup Windows signing credentials
        shell: bash
        env:
          WIN_CERTIFICATE_BASE64: ${{ secrets.WIN_CERTIFICATE_BASE64 }}
        run: |
          if [ -z "$WIN_CERTIFICATE_BASE64" ]; then
            echo "No Windows signing certificate configured, skipping signing setup."
            exit 0
          fi
          mkdir -p /tmp/legalwork-certs
          echo "$WIN_CERTIFICATE_BASE64" | base64 -d > /tmp/legalwork-certs/win.pfx
          echo "WIN_CERT_PATH=/tmp/legalwork-certs/win.pfx" >> "$GITHUB_ENV"

      - name: Build Windows artifacts
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          LEGALWORK_APP_VERSION: ${{ needs.create-release.outputs.version }}
          LEGALWORK_UPDATE_CHANNEL: stable
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ env.WIN_CERT_PATH || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
          LEGALWORK_ERROR_REPORT_GITHUB_REPO: ${{ secrets.ERROR_REPORT_REPO }}
          LEGALWORK_ERROR_REPORT_GITHUB_TOKEN: ${{ secrets.ERROR_REPORT_TOKEN }}
          LEGALWORK_ERROR_REPORT_GITHUB_LABEL: ${{ secrets.ERROR_REPORT_LABEL }}
        run: npm run dist:win

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            ${{ env.WORKING_DIRECTORY }}/dist/legalwork-*-win-*.exe
            ${{ env.WORKING_DIRECTORY }}/dist/legalwork-*-win-*.exe.blockmap
            ${{ env.WORKING_DIRECTORY }}/dist/latest.yml
          if-no-files-found: error

  build-linux:
    name: Build Linux
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci

      - name: Build Linux artifacts
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          LEGALWORK_APP_VERSION: ${{ needs.create-release.outputs.version }}
          LEGALWORK_UPDATE_CHANNEL: stable
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGALWORK_ERROR_REPORT_GITHUB_REPO: ${{ secrets.ERROR_REPORT_REPO }}
          LEGALWORK_ERROR_REPORT_GITHUB_TOKEN: ${{ secrets.ERROR_REPORT_TOKEN }}
          LEGALWORK_ERROR_REPORT_GITHUB_LABEL: ${{ secrets.ERROR_REPORT_LABEL }}
        run: npm run dist -- --linux AppImage --x64

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: |
            ${{ env.WORKING_DIRECTORY }}/dist/legalwork-*.AppImage
            ${{ env.WORKING_DIRECTORY }}/dist/latest-linux.yml
          if-no-files-found: error

  upload-release-assets:
    name: Upload release assets
    needs: [create-release, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4

      - name: Upload assets in user-facing order
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          upload_matching() {
            local label="$1"
            shift
            local files=()
            local pattern

            shopt -s nullglob
            for pattern in "$@"; do
              files+=( ${pattern} )
            done
            shopt -u nullglob

            if [[ ${#files[@]} -eq 0 ]]; then
              # 某些平台/架构不产出对应资产（如 32 位安装包）时仅跳过，不中断整个上传。
              echo "Skipping (no assets produced): ${label}" >&2
              continue
            fi

            for file in "${files[@]}"; do
              echo "Uploading ${label}: ${file}"
              gh release upload "${{ needs.create-release.outputs.tag_name }}" "${file}" \
                --clobber --repo "${{ github.repository }}"
            done
          }

          # GitHub shows only the first few assets before collapsing the list, so put DMG installers first.
          upload_matching "macOS Apple Silicon DMG" "macos-assets/legalwork-*-mac-arm64.dmg"
          upload_matching "macOS Intel DMG" "macos-assets/legalwork-*-mac-x64.dmg"
          upload_matching "Windows x64 installer" "windows-assets/legalwork-*-win-x64.exe"
          upload_matching "Linux AppImage" "linux-assets/legalwork-*.AppImage"
          upload_matching "macOS auto-update zip" "macos-assets/legalwork-*-mac-*.zip"
          upload_matching "macOS auto-update blockmap" "macos-assets/legalwork-*-mac-*.blockmap"
          upload_matching "Windows auto-update blockmap" "windows-assets/legalwork-*-win-*.exe.blockmap"
          upload_matching "update metadata" "macos-assets/latest-mac.yml" "windows-assets/latest.yml" "linux-assets/latest-linux.yml"

  publish-release:
    name: Publish release
    needs: [create-release, upload-release-assets]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.create-release.outputs.tag_name }}" \
            --draft=false \
            --repo "${{ github.repository }}"

  publish-cos:
    name: Publish Windows installer to Tencent COS
    needs: [upload-release-assets]
    runs-on: ubuntu-latest
    # 未配置 COS 密钥时跳过,不阻塞 GitHub 发布
    if: ${{ secrets.COS_SECRET_ID != '' && secrets.COS_SECRET_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: Download build artifacts
        uses: actions/download-artifact@v4

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci

      # 把 Windows 安装包同步到腾讯云 COS(国内直下、无需梯子)。
      # 复用 publish-r2.mjs(S3 兼容),经 R2_*/S3_* 环境变量指向 COS。
      - name: Publish Windows installer to Tencent COS
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          S3_BUCKET: legalwork-1318565101
          S3_ENDPOINT: https://cos.ap-guangzhou.myqcloud.com
          S3_REGION: ap-guangzhou
          S3_FORCE_PATH_STYLE: 'false'
          S3_ACCESS_KEY_ID: ${{ secrets.COS_SECRET_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.COS_SECRET_KEY }}
          R2_PUBLIC_BASE_URL: https://legalwork-1318565101.cos.ap-guangzhou.myqcloud.com
          R2_RELEASE_PREFIX: legalwork
          RELEASE_CHANNEL: stable
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.create-release.outputs.tag_name }}"
          node scripts/publish-r2.mjs upload --platform win --tag "$TAG" --channel stable --dist "$GITHUB_WORKSPACE/windows-assets"
          node scripts/publish-r2.mjs upload --platform mac --tag "$TAG" --channel stable --dist "$GITHUB_WORKSPACE/macos-assets"
          node scripts/publish-r2.mjs promote --tag "$TAG" --channel stable --platforms win,mac
