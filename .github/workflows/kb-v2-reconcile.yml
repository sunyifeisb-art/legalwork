name: KB v2 reconcile with latest main

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile-test-commit:
    if: github.head_ref == 'agent/knowledge-base-v2-reconcile' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/knowledge-base-v2-reconcile
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reapply non-conflicting first-round files
        shell: bash
        run: |
          git checkout origin/agent/knowledge-base-v2 -- \
            apps/desktop-legalwork/legalwork/src/adapters/tool/knowledge-tool-provider.ts \
            apps/desktop-legalwork/legalwork/src/contracts/knowledge.ts \
            apps/desktop-legalwork/legalwork/src/knowledge/knowledge-file-reader.ts \
            apps/desktop-legalwork/legalwork/src/knowledge/knowledge-file-reader.test.ts \
            apps/desktop-legalwork/legalwork/src/knowledge/knowledge-store.ts \
            apps/desktop-legalwork/legalwork/src/knowledge/knowledge-store.test.ts \
            apps/desktop-legalwork/legalwork/src/loop/knowledge-qa-mode.ts \
            apps/desktop-legalwork/legalwork/src/loop/knowledge-qa-mode.test.ts \
            apps/desktop-legalwork/src/renderer/src/components/knowledge-base/KnowledgeBaseView.tsx

      - name: Reconcile overlapping runtime files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          model = 'apps/desktop-legalwork/legalwork/src/adapters/model/deepseek-compat-model-client.ts'
          replace_once(
              model,
              """    const windowSize = this.config.historyLimit ?? resolveHistoryLimit()\n    const history = windowSize\n      ? limitHistoryPreservingCompaction(request.history, windowSize)\n      : request.history""",
              """    // AgentLoop/ContextCompactor is the sole owner of history folding.\n    // Provider-side sliding changes the prompt prefix and defeats prefix-cache reuse.\n    const history = request.history"""
          )

          loop = 'apps/desktop-legalwork/legalwork/src/loop/agent-loop.ts'
          replace_once(
              loop,
              "import { resolveImaRouteAction } from './ima-knowledge-router.js'",
              "import { resolveImaRouteAction } from './ima-knowledge-router.js'\nimport { isKnowledgeQaThreadTitle, knowledgeQaToolSpecs } from './knowledge-qa-mode.js'"
          )
          replace_once(
              loop,
              """      this.toolStormBreakers.delete(turnId)\n      this.turnInputTokenSpend.delete(turnId)""",
              """      this.toolStormBreakers.delete(turnId)\n      this.retrievalLedgers.delete(turnId)\n      this.turnInputTokenSpend.delete(turnId)"""
          )
          replace_once(
              loop,
              """    // Disable IMA auto-routing for file-scoped knowledge-base Q&A threads\n    // (\"知识库：<file> · ...\"): the file content is already injected locally and\n    // an extra IMA cloud call would add cost with little benefit. Global\n    // knowledge-base Q&A (\"知识库全局对话 · ...\") keeps IMA routing.\n    const isFileKnowledgeThread = thread?.title?.startsWith('知识库：')\n    const imaRouteAction = resolveImaRouteAction({\n      prompt: turn?.prompt ?? '',\n      tools: toolSpecs,\n      items: healed.items,\n      turnId,\n      enabled: !planTurnActive && !isFileKnowledgeThread\n    })\n    const requiredToolName = planRequiredToolName ?? imaRouteAction?.requiredToolName\n    const requestToolSpecs = requiredToolName\n      ? toolSpecs.filter((tool) => tool.name === requiredToolName)\n      : toolSpecs""",
              """    // Knowledge-base UI already injects its retrieved evidence into these\n    // threads. Ordinary QA therefore becomes one direct model request: no second\n    // knowledge/IMA/tool retrieval pass. Plan mode keeps the full tool path.\n    const isKnowledgeQaThread = isKnowledgeQaThreadTitle(thread?.title) && !planTurnActive\n    const scopedToolSpecs = knowledgeQaToolSpecs(toolSpecs, {\n      title: thread?.title,\n      planTurnActive\n    })\n    const imaRouteAction = resolveImaRouteAction({\n      prompt: turn?.prompt ?? '',\n      tools: scopedToolSpecs,\n      items: healed.items,\n      turnId,\n      enabled: !planTurnActive && !isKnowledgeQaThread\n    })\n    const requiredToolName = planRequiredToolName ?? imaRouteAction?.requiredToolName\n    const requestToolSpecs = requiredToolName\n      ? scopedToolSpecs.filter((tool) => tool.name === requiredToolName)\n      : scopedToolSpecs"""
          )
          replace_once(
              loop,
              "...(this.opts.primaryLegalSource ? [primaryLegalSourceInstruction(this.opts.primaryLegalSource)] : []),",
              "...(!isKnowledgeQaThread && this.opts.primaryLegalSource ? [primaryLegalSourceInstruction(this.opts.primaryLegalSource)] : []),"
          )
          replace_once(
              loop,
              """  private ledgerFor(threadId: string): RetrievalLedger {\n    let ledger = this.retrievalLedgers.get(threadId)\n    if (!ledger) {\n      ledger = new RetrievalLedger()\n      this.retrievalLedgers.set(threadId, ledger)\n    }\n    return ledger\n  }\n\n  private retrievalDuplicateFor(threadId: string, call: ToolCallLike): string | null {\n    const toolName = call.toolName\n    // Only dedupe knowledge retrieval tools that pull bulk content into history.\n    if (!DEDUP_TOOL_NAMES.has(toolName)) return null\n    const ledger = this.retrievalLedgers.get(threadId)\n    if (!ledger) return null\n    return ledger.duplicateKey(toolName, call.arguments)\n  }""",
              """  private ledgerFor(turnId: string): RetrievalLedger {\n    let ledger = this.retrievalLedgers.get(turnId)\n    if (!ledger) {\n      ledger = new RetrievalLedger()\n      this.retrievalLedgers.set(turnId, ledger)\n    }\n    return ledger\n  }\n\n  private retrievalDuplicateFor(turnId: string, call: ToolCallLike): string | null {\n    const toolName = call.toolName\n    // Only dedupe knowledge retrieval tools that pull bulk content into history.\n    if (!DEDUP_TOOL_NAMES.has(toolName)) return null\n    const ledger = this.retrievalLedgers.get(turnId)\n    if (!ledger) return null\n    return ledger.duplicateKey(toolName, call.arguments)\n  }"""
          )
          replace_once(loop, 'const duplicate = this.retrievalDuplicateFor(input.threadId, input.call)', 'const duplicate = this.retrievalDuplicateFor(input.turnId, input.call)')
          replace_once(loop, 'This knowledge retrieval was already performed earlier in this thread', 'This knowledge retrieval was already performed earlier in this turn')
          replace_once(loop, 'this.ledgerFor(input.threadId).record(input.call.toolName, input.call.arguments)', 'this.ledgerFor(input.turnId).record(input.call.toolName, input.call.arguments)')

          tests = 'apps/desktop-legalwork/legalwork/tests/model-client.test.ts'
          replace_once(
              tests,
              "it('preserves the latest compaction summary when applying history limits', async () => {",
              "it('preserves compaction history without provider-side sliding limits', async () => {"
          )
          PY

      - name: Install runtime dependencies
        working-directory: apps/desktop-legalwork/legalwork
        run: npm ci

      - name: Typecheck runtime and reject new errors
        working-directory: apps/desktop-legalwork/legalwork
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/runtime-ts.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep 'error TS' /tmp/runtime-ts.log > /tmp/runtime-errors.log || true
          grep -Ev '^(tests/builtin-search-tools\.test\.ts|tests/builtin-tools\.test\.ts)' /tmp/runtime-errors.log > /tmp/runtime-new.log || true
          if [ -s /tmp/runtime-new.log ]; then cat /tmp/runtime-new.log; exit 1; fi

      - name: Run first-round regression tests
        working-directory: apps/desktop-legalwork/legalwork
        run: npx vitest run src/knowledge/knowledge-store.test.ts src/knowledge/knowledge-file-reader.test.ts src/loop/knowledge-qa-mode.test.ts tests/model-client.test.ts src/loop/context-compactor.test.ts

      - name: Install desktop dependencies
        working-directory: apps/desktop-legalwork
        run: npm ci --ignore-scripts

      - name: Typecheck desktop and reject new errors
        working-directory: apps/desktop-legalwork
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/desktop-ts.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep 'error TS' /tmp/desktop-ts.log > /tmp/desktop-errors.log || true
          grep -Ev '^(src/renderer/src/components/astryx/AstryxSegmentButton\.test\.ts|src/renderer/src/components/chat/FloatingComposer\.test\.ts|src/renderer/src/components/document-writing/DocumentWritingEditor\.test\.ts|src/renderer/src/store/chat-store\.ts)' /tmp/desktop-errors.log > /tmp/desktop-new.log || true
          if [ -s /tmp/desktop-new.log ]; then cat /tmp/desktop-new.log; exit 1; fi

      - name: Commit reconciled first round and self-delete workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/kb-v2-reconcile.yml
          git add apps/desktop-legalwork/legalwork/src apps/desktop-legalwork/legalwork/tests apps/desktop-legalwork/src/renderer/src/components/knowledge-base/KnowledgeBaseView.tsx
          git commit -m 'refactor(knowledge): reconcile KB v2 fixes with latest main'
          git push origin HEAD:agent/knowledge-base-v2-reconcile
