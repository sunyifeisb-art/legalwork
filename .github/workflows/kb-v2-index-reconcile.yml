name: KB v2 index reconcile validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile-test-commit:
    if: github.head_ref == 'agent/knowledge-base-v2-index-reconcile' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/knowledge-base-v2-index-reconcile
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reapply validated phase-two files
        shell: bash
        run: |
          git checkout origin/agent/knowledge-base-v2-index -- \
            apps/desktop-legalwork/legalwork/src/adapters/tool/knowledge-tool-provider.ts \
            apps/desktop-legalwork/legalwork/src/contracts/knowledge-retrieval.ts \
            apps/desktop-legalwork/legalwork/src/contracts/knowledge.ts \
            apps/desktop-legalwork/legalwork/src/knowledge/knowledge-citation-verifier.test.ts \
            apps/desktop-legalwork/legalwork/src/knowledge/knowledge-citation-verifier.ts \
            apps/desktop-legalwork/legalwork/src/knowledge/knowledge-index-version.test.ts \
            apps/desktop-legalwork/legalwork/src/knowledge/knowledge-index-version.ts \
            apps/desktop-legalwork/legalwork/src/knowledge/knowledge-retrieval-cache.test.ts \
            apps/desktop-legalwork/legalwork/src/knowledge/knowledge-retrieval-cache.ts \
            apps/desktop-legalwork/legalwork/src/knowledge/knowledge-retrieval-pipeline.ts \
            apps/desktop-legalwork/legalwork/src/knowledge/knowledge-sqlite-index.test.ts \
            apps/desktop-legalwork/legalwork/src/knowledge/knowledge-sqlite-index.ts \
            apps/desktop-legalwork/legalwork/src/knowledge/knowledge-store.test.ts \
            apps/desktop-legalwork/legalwork/src/knowledge/knowledge-store.ts \
            apps/desktop-legalwork/legalwork/src/knowledge/knowledge-structured-chunker.test.ts \
            apps/desktop-legalwork/legalwork/src/knowledge/knowledge-structured-chunker.ts \
            apps/desktop-legalwork/legalwork/src/knowledge/knowledge-vector-retriever.test.ts \
            apps/desktop-legalwork/legalwork/src/knowledge/knowledge-vector-retriever.ts \
            apps/desktop-legalwork/src/renderer/src/components/knowledge-base/KnowledgeBaseView.tsx

      - name: Remove legacy JSON index path and harden FTS reopen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def remove_between(path: str, start_marker: str, end_marker: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{path}: start marker not found: {start_marker!r}')
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'{path}: end marker not found: {end_marker!r}')
              p.write_text(text[:start] + text[end:], encoding='utf-8')

          store = 'apps/desktop-legalwork/legalwork/src/knowledge/knowledge-store.ts'
          replace_once(store, '  KnowledgeDocument,\n  KnowledgeEdge,\n  KnowledgeFileContent,', '  KnowledgeDocument,\n  KnowledgeFileContent,')
          remove_between(store, 'type KnowledgeIndex = {\n', 'const TEXT_EXTENSIONS = new Set([')
          replace_once(store, 'const CHUNK_SIZE = 2400\nconst CHUNK_OVERLAP = 240\n', '')
          remove_between(store, '  private async readIndex(): Promise<KnowledgeIndex> {\n', '  private async uniqueManagedPath(relativePath: string): Promise<string> {')
          remove_between(store, '  private indexPath(): string {\n', '  private now(): string {')
          remove_between(store, 'function chunkDocument(document: KnowledgeDocument, content: string): KnowledgeChunk[] {\n', 'function scoreChunk(')

          sqlite = 'apps/desktop-legalwork/legalwork/src/knowledge/knowledge-sqlite-index.ts'
          old = r'''    try {
      db.exec(`
        CREATE VIRTUAL TABLE IF NOT EXISTS chunks_fts USING fts5(
          chunk_id UNINDEXED,
          title,
          relative_path,
          category,
          keywords,
          heading_path,
          article_number,
          content,
          tokenize='trigram'
        );
      `)
      this.ftsTokenizer = 'trigram'
    } catch {
      db.exec(`DROP TABLE IF EXISTS chunks_fts;`)
      db.exec(`
        CREATE VIRTUAL TABLE chunks_fts USING fts5(
          chunk_id UNINDEXED,
          title,
          relative_path,
          category,
          keywords,
          heading_path,
          article_number,
          content,
          tokenize='unicode61'
        );
      `)
      this.ftsTokenizer = 'unicode61'
    }'''
          new = r'''    const existingFts = db.prepare(`
      SELECT sql FROM sqlite_master
      WHERE type = 'table' AND name = 'chunks_fts'
    `).get() as { sql?: string } | undefined
    if (existingFts) {
      this.ftsTokenizer = /unicode61/i.test(existingFts.sql ?? '') ? 'unicode61' : 'trigram'
    } else {
      try {
        db.exec(`
          CREATE VIRTUAL TABLE chunks_fts USING fts5(
            chunk_id UNINDEXED,
            title,
            relative_path,
            category,
            keywords,
            heading_path,
            article_number,
            content,
            tokenize='trigram'
          );
        `)
        this.ftsTokenizer = 'trigram'
      } catch {
        db.exec(`DROP TABLE IF EXISTS chunks_fts;`)
        db.exec(`
          CREATE VIRTUAL TABLE chunks_fts USING fts5(
            chunk_id UNINDEXED,
            title,
            relative_path,
            category,
            keywords,
            heading_path,
            article_number,
            content,
            tokenize='unicode61'
          );
        `)
        this.ftsTokenizer = 'unicode61'
      }
    }'''
          replace_once(sqlite, old, new)

          test = 'apps/desktop-legalwork/legalwork/src/knowledge/knowledge-sqlite-index.test.ts'
          marker = "  it('deletes documents that are no longer in the current indexed set', async () => {"
          reopen = r'''  it('reopens an existing FTS database and preserves retrieval behavior', async () => {
    const root = await mkdtemp(join(tmpdir(), 'legalwork-kb-sqlite-reopen-'))
    let index = new KnowledgeSqliteIndex(root)
    try {
      const doc: KnowledgeDocument = {
        id: 'doc_reopen',
        title: '合同解除规则',
        path: '/tmp/reopen.md',
        sourceRoot: '/tmp',
        relativePath: '法规/合同解除规则.md',
        extension: '.md',
        sizeBytes: 64,
        updatedAt: '2026-08-07T00:00:00.000Z',
        documentHash: 'hash-reopen',
        sourceMtimeMs: 10,
        indexedAt: '2026-08-07T00:00:00.000Z'
      }
      await index.upsertDocument(doc, chunkKnowledgeDocument(doc, '第一条 合同解除应当符合约定或者法律规定。', 'hash-reopen'))
      index.close()

      index = new KnowledgeSqliteIndex(root)
      const hits = await index.searchCandidates({ query: '合同解除', limit: 10 })
      expect(hits.some((hit) => hit.content.includes('合同解除'))).toBe(true)
    } finally {
      index.close()
      await rm(root, { recursive: true, force: true })
    }
  })

'''
          replace_once(test, marker, reopen + marker)
          PY

      - name: Install runtime dependencies
        working-directory: apps/desktop-legalwork/legalwork
        run: npm ci

      - name: Typecheck runtime and reject new errors
        working-directory: apps/desktop-legalwork/legalwork
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/runtime-ts.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep 'error TS' /tmp/runtime-ts.log > /tmp/runtime-errors.log || true
          grep -Ev '^(tests/builtin-search-tools\.test\.ts|tests/builtin-tools\.test\.ts)' /tmp/runtime-errors.log > /tmp/runtime-new.log || true
          if [ -s /tmp/runtime-new.log ]; then cat /tmp/runtime-new.log; exit 1; fi

      - name: Run phase-two knowledge regression tests
        working-directory: apps/desktop-legalwork/legalwork
        run: npx vitest run src/knowledge/knowledge-store.test.ts src/knowledge/knowledge-structured-chunker.test.ts src/knowledge/knowledge-sqlite-index.test.ts src/knowledge/knowledge-citation-verifier.test.ts src/knowledge/knowledge-vector-retriever.test.ts src/knowledge/knowledge-index-version.test.ts src/knowledge/knowledge-retrieval-cache.test.ts src/knowledge/knowledge-file-reader.test.ts src/loop/knowledge-qa-mode.test.ts tests/model-client.test.ts src/loop/context-compactor.test.ts

      - name: Install desktop dependencies
        working-directory: apps/desktop-legalwork
        run: npm ci --ignore-scripts

      - name: Typecheck desktop and reject new errors
        working-directory: apps/desktop-legalwork
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/desktop-ts.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep 'error TS' /tmp/desktop-ts.log > /tmp/desktop-errors.log || true
          grep -Ev '^(src/renderer/src/agent/legalwork-mapper\.ts|src/renderer/src/components/astryx/AstryxSegmentButton\.test\.ts|src/renderer/src/components/chat/FloatingComposer\.test\.ts|src/renderer/src/components/document-writing/DocumentWritingEditor\.test\.ts|src/renderer/src/store/chat-store\.ts)' /tmp/desktop-errors.log > /tmp/desktop-new.log || true
          if [ -s /tmp/desktop-new.log ]; then cat /tmp/desktop-new.log; exit 1; fi

      - name: Commit reconciled phase two and self-delete workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/kb-v2-index-reconcile.yml
          git add apps/desktop-legalwork/legalwork/src apps/desktop-legalwork/legalwork/tests apps/desktop-legalwork/src/renderer/src/components/knowledge-base/KnowledgeBaseView.tsx
          git commit -m 'refactor(knowledge): reconcile SQLite FTS index with latest main'
          git push origin HEAD:agent/knowledge-base-v2-index-reconcile
